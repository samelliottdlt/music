  # ---------- Pedals ----------
  - id: boss-tuner
    name: BOSS TU-3S chromatic tuner
    category: effects
    role: tuner pedal; always on, no footswitch, output never muted (doesn't change the sound)
    model: TU-3S
    placement: TODO  # still on the pedalboard? If so it goes first, before the Chroma Console (TU-3S manual)
    inputs: ["INPUT", "DC IN (BOSS PSA-series AC adaptor, sold separately)"]
    outputs: ["OUTPUT (never muted)", "DC OUT (powers PSA-compatible pedals through a PCS-20A cord)"]
    docs: https://www.boss.info/us/products/tu-3s/
    details: gear/boss-tuner.md

  - id: chroma-console
    name: Hologram Electronics Chroma Console
    category: effects
    role: multi-effect (Character / Movement / Diffusion / Texture); the only pedal on the board, between the instruments and the amp
    inputs: ["1/4in stereo-capable in", "expression", "MIDI"]
    outputs: ["1/4in stereo-capable out"]
    connects_to: orange-micro-terror
    docs: https://www.hologramelectronics.com/pages/chroma-console-manual
    firmware: https://www.hologramelectronics.com/pages/chroma-console-firmware
    details: gear/chroma-console.md

  - id: orange-micro-terror
    name: Orange Micro Terror
    category: amplification
    role: guitar amp head (valve preamp); its HEADPHONES out feeds a TX-6 channel
    model: Micro Terror
    inputs: ["INPUT 1/4in", "AUX IN 3.5mm (summed to mono)"]
    outputs: ["HEADPHONES 1/4in (with CabSim; OK into a mixer)", "SPEAKER OUTPUTS (cab 8 ohm or higher)"]
    output_used_to_mixer: HEADPHONES  # NEVER the speaker outputs
    speaker_cabinet: none  # the OB-4 (via the TX-6) is the only speaker, so HEADPHONES -> TX-6 must stay plugged in whenever the amp is on
    power: 15V DC 2A, included adapter only
    connects_to: tx-6
    docs: https://orangeamps.com/products/micro-terror
    details: gear/orange-micro-terror.md

  # ---------- Teenage Engineering ----------
  - id: op-1-field
    name: Teenage Engineering OP-1 field
    category: synth / sampler / 4-track tape recorder
    role: synth today; intended recorder for the whole rig
    inputs: ["3.5mm stereo line in", "built-in mic", "USB-C audio", "FM radio rx"]
    outputs: ["3.5mm stereo out (TRRS headset)", "USB-C audio", "FM radio tx"]
    connectivity: ["USB-C audio/MIDI host+device", "BLE MIDI"]
    connects_to: tx-6
    docs: https://teenage.engineering/guides/op-1
    firmware: https://teenage.engineering/downloads/op-1/field
    details: gear/op-1-field.md

  - id: op-xy
    name: Teenage Engineering OP-XY
    category: sequencer / synth / sampler
    inputs: ["3.5mm stereo line in", "built-in mic", "USB-C audio"]
    outputs: ["3.5mm stereo out (TRRS headset)", "3.5mm multi-out (MIDI/CV/sync/audio)", "USB-C audio"]
    connectivity: ["USB-C audio/MIDI host+device", "BLE MIDI"]
    connects_to: tx-6
    docs: https://teenage.engineering/guides/op-xy
    firmware: https://teenage.engineering/downloads/op-xy
    details: gear/op-xy.md

  - id: tx-6
    name: Teenage Engineering TX-6
    category: mixer / audio interface
    role: central mixer — everything goes here
    inputs: ["6x 3.5mm stereo channel inputs", "USB-C audio"]
    outputs: ["6.35mm main out (removable 3.5mm adapter included)", "3.5mm aux out", "3.5mm cue/headphone (TRRS)", "USB-C audio (12in/12out)"]
    connectivity: ["USB-C MIDI", "BLE MIDI"]
    docs: https://teenage.engineering/guides/tx-6
    firmware: https://teenage.engineering/downloads/tx-6
    details: gear/tx-6.md

  - id: ob-4
    name: Teenage Engineering OB-4
    category: speaker
    role: monitor speaker fed by the TX-6
    inputs: ["3.5mm stereo line in", "Bluetooth", "FM radio"]
    outputs: []
    firmware_via: orthoplay app (iOS/Android)
    docs: https://teenage.engineering/guides/ob-4
    details: gear/ob-4.md
