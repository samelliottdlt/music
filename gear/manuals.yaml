# Official manuals for Sam's gear: a registry of LINKS, not files.
#
# Never commit the manuals themselves, or images rendered from them, to this
# public repo: they're the vendors' copyrighted material, some are huge (the
# OP-XY guide is ~30 MB, and every revision would stay in git history), and a
# committed copy silently drifts from the official one. Fetch them on demand
# into a local cache outside the repo (~/.cache/music-manuals, override with
# MUSIC_MANUALS_CACHE):
#
#   uv run .github/skills/music-setup/scripts/manuals.py list
#   uv run .github/skills/music-setup/scripts/manuals.py fetch <manual-id|gear-id|all>
#   uv run .github/skills/music-setup/scripts/manuals.py search <manual-id|gear-id|all> "terms"
#   uv run .github/skills/music-setup/scripts/manuals.py text <manual-id> <page>
#   uv run .github/skills/music-setup/scripts/manuals.py check     # links alive? newer versions?
#
# When fetch/check reports a problem (exit code 2 = BROKEN, 3 = drift):
#   BROKEN   dead link, not a PDF anymore, or discovery stopped working
#   MOVED    the link redirects somewhere else
#   CHANGED  same URL, different file: the manual was revised upstream
#   NEWER    the vendor publishes a newer version than `url`
#   NEW      the entry has no `verified` block yet
# tell Sam, find the current official file (start at `discover.page`), and
# update the entry BY HAND: the tool prints a ready-to-paste snippet, but
# don't regenerate this file (the comments matter). Then run
# `fetch <id> --refresh` and re-verify facts in gear/*.md that were cited from
# the old version (page numbers can shift).
#
# Fields
#   id         unique kebab-case id, used in commands, citations and diagram recipes
#   gear       inventory id(s) from gear/inventory.yaml
#   title      title as printed on the document; `short` = label for citations
#   kind       pdf | image-guide (web guide made of page images) | web (HTML page)
#   url        the official file/page, i.e. what citations link to. PDFs: append
#              #page=N using PDF page numbers (not the numbers printed on the page)
#   version    document / firmware version it covers
#   discover   how to spot a newer version: `page` + `method` + `match` regex
#                te-assets     teenage.engineering page; newest asset whose name matches
#                link          newest link matching the regex (capture group 1 = version key)
#                text-version  version string on the page (group 1) vs `version`
#                none          no reliable way; check by hand now and then
#   verified   what was last verified upstream: date, sha256, bytes, pages, etag, last_modified
#   notes      what an agent needs to know to use the document well
#
# Every gear id in gear/inventory.yaml has at least one entry.

manuals:
